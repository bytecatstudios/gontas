<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GontAS | Sitio oficial</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* evita barras de desplazamiento */
        }

        .img-tamaño {
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* mejor en celulares con barra de navegador */
            object-fit: cover;
        }
    </style>
</head>
<body>
    <img src="Assets/mantenimiento.png" alt="Imagen de mantenimiento" class="img-tamaño">
</body>
</html>
